# =======================================================================
# CLASH OF BYTES: SPRING BOOT APPLICATION CONFIGURATION
# Default Profile: dev (SQLite fallback) / prod (PostgreSQL)
# =======================================================================

spring.application.name=clash-of-bytes-backend
server.port=8080

# Profile selection
spring.profiles.active=dev

# CORS Allowed Origins
clashofbytes.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173

# JWT Configuration
clashofbytes.jwt.secret=ClashOfBytesSecretKey20262027CyberpunkFightingGameArenaProductionSecretKey123
clashofbytes.jwt.expiration-ms=86400000

# Server Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
