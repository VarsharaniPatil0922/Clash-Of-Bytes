<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Bytes — 2D Cyber Multiplayer Fighting Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #060913;
      --neon-cyan: #00e5ff;
      --neon-pink: #ff2a6d;
      --neon-gold: #ffcc00;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-void);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(255, 42, 109, 0.08) 0%, transparent 50%);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      color: #fff;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    h1 span { color: var(--neon-cyan); }
    p {
      color: var(--text-muted);
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #00e5ff, #0088cc);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn:hover {
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.8);
      transform: translateY(-2px);
    }
  </style>
  <script>
    // Automatic forward to built app or standalone client if available
    (function() {
      var paths = [
        '/Clash_Of_Bytes/website/frontend/dist/index.html',
        '/dist/index.html',
        '/arena.html'
      ];
      // If deployed as static folder on Vercel without root directory config
      if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
        fetch(paths[0], { method: 'HEAD' }).then(function(r) {
          if (r.ok) window.location.replace(paths[0]);
        }).catch(function() {});
      }
    })();
  </script>
</head>
<body>
  <h1>CLASH OF <span>BYTES</span></h1>
  <p>2D Cyber Multiplayer Fighting Game &bull; Web Combat Arena</p>
  <a class="btn" href="/Clash_Of_Bytes/website/frontend/dist/index.html">Enter Arena &rarr;</a>
</body>
</html>
